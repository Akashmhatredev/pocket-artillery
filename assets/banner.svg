<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pocket Artillery — animated artillery duel banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0B10"/>
      <stop offset="55%" stop-color="#11131C"/>
      <stop offset="100%" stop-color="#1A1D29"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>
    <radialGradient id="alphaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="omegaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#e2e8f0">
    <circle cx="140" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="66" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="130" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="150" r="1.1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="150" font-size="66" font-weight="900" letter-spacing="10" fill="#f1f5f9" filter="url(#titleGlow)">
      POCKET <tspan fill="#22d3ee">ARTILLERY</tspan>
    </text>
    <text x="600" y="190" font-size="17" font-weight="700" letter-spacing="8" fill="#64748b">
      TURN&#8211;BASED&#160;&#160;&#8226;&#160;&#160;DESTRUCTIBLE&#160;TERRAIN&#160;&#160;&#8226;&#160;&#160;REAL&#8211;TIME&#160;MULTIPLAYER
    </text>
  </g>

  <!-- destructible terrain -->
  <path d="M0,400 L0,300 Q150,250 300,290 T600,285 Q780,300 900,272 T1200,300 L1200,400 Z" fill="url(#terrain)"/>
  <path d="M0,302 Q150,252 300,292 T600,287 Q780,302 900,274 T1200,302" fill="none" stroke="#334155" stroke-width="2" opacity="0.7"/>

  <!-- Alpha tank (cyan, left) -->
  <g transform="translate(175,292)">
    <ellipse cx="0" cy="4" rx="60" ry="26" fill="url(#alphaGlow)" filter="url(#soft)"/>
    <rect x="-24" y="-2" width="48" height="14" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M-14,-2 Q0,-18 14,-2 Z" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="-2" y="-30" width="30" height="6" rx="3" fill="#22d3ee" transform="rotate(-42)"/>
    <circle cx="-15" cy="12" r="4.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="4.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="15" cy="12" r="4.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="0" y="-40" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#22d3ee" letter-spacing="2">ALPHA</text>
    <!-- muzzle flash -->
    <circle cx="20" cy="-22" r="10" fill="#fcd34d">
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.03;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;14;4;4;4" keyTimes="0;0.03;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Omega tank (rose, right) -->
  <g transform="translate(1015,274)">
    <ellipse cx="0" cy="4" rx="60" ry="26" fill="url(#omegaGlow)" filter="url(#soft)"/>
    <rect x="-24" y="-2" width="48" height="14" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <path d="M-14,-2 Q0,-18 14,-2 Z" fill="#7f1d3a" stroke="#fb7185" stroke-width="1.5"/>
    <rect x="-28" y="-30" width="30" height="6" rx="3" fill="#fb7185" transform="rotate(42)"/>
    <circle cx="-15" cy="12" r="4.5" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="4.5" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="15" cy="12" r="4.5" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <text x="0" y="-40" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#fb7185" letter-spacing="2">OMEGA</text>
  </g>

  <!-- projectile arcing across the map -->
  <g>
    <circle r="6" fill="#fcd34d" stroke="#f97316" stroke-width="2">
      <animateMotion path="M195,270 Q600,40 1015,252" dur="4s" repeatCount="indefinite"
        keyPoints="0;0.5;0.5;0.5" keyTimes="0;0.5;0.9;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- smoke trail dot -->
    <circle r="3" fill="#94a3b8" opacity="0.5">
      <animateMotion path="M195,270 Q600,40 1015,252" dur="4s" repeatCount="indefinite"
        keyPoints="0;0.48;0.48;0.48" keyTimes="0;0.48;0.9;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0.5;0.5;0;0" keyTimes="0;0.48;0.48;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- explosion at impact -->
  <g transform="translate(1015,252)">
    <circle r="10" fill="url(#blast)">
      <animate attributeName="r" values="0;0;70;0;0" keyTimes="0;0.5;0.62;0.75;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.6;0.75;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#fef3c7">
      <animate attributeName="r" values="0;0;26;0;0" keyTimes="0;0.5;0.6;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.58;0.7;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wind indicator -->
  <g transform="translate(600,235)" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif">
    <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="3" fill="#475569">WIND &#8594;</text>
    <line x1="-34" y1="10" x2="34" y2="10" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
